<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tani Musim</title>
<meta name="theme-color" content="#16231a">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;min-height:100%;background:#16231a;color:#efe8d0;font-family:system-ui,sans-serif}
#app{max-width:420px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}
#top{display:flex;justify-content:space-between;align-items:baseline}
#money{font-size:28px;font-weight:700;color:#f5c542}
#info{font-size:12px;color:#9bb08a;text-align:right;line-height:1.5}
#crops{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#crops button.oos{opacity:.55}
#crops button{flex:1;padding:8px 2px;font-size:12px;border-radius:8px;border:2px solid #34503a;background:#1f3324;color:#efe8d0;line-height:1.3}
#crops button.sel{border-color:#f5c542}
#crops button.lock{opacity:.55}
#field{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#2c4a30;padding:10px;border-radius:12px}
.plot{position:relative;aspect-ratio:1;background:#5a3a22;border-radius:8px;overflow:hidden;border:2px solid #7a5230}
.veg{position:absolute;left:10%;right:10%;top:14%;bottom:0;transform-origin:50% 100%}
.veg svg{width:100%;height:100%}
.veg.rdy{animation:glow .6s infinite alternate}
@keyframes glow{to{filter:brightness(1.5)}}
.pop{position:absolute;left:0;right:0;top:35%;text-align:center;color:#f5c542;font-weight:700;font-size:14px;animation:up .8s forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-30px);opacity:0}}
.lbl{position:absolute;left:0;right:0;top:3px;text-align:center;font-size:11px;color:#efe8d0cc}
#ups,#ug{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#ups button,#ug button{background:#1f3324;border:1px solid #3f6a47;color:#efe8d0;border-radius:10px;padding:10px 8px;text-align:left;font-size:13px;line-height:1.4}
#ups button b,#ug button b{display:block;font-size:14px;color:#fff}
#ups button span,#ug button span{color:#f5c542}
#ups button.off,#ug button.off{opacity:.45}
#ups button:active,#ug button:active{background:#2a4a31}
#qh{font-size:14px;color:#f5c542;margin-top:2px}
#qs,#gp,#ol,#sl,#sr,#pr,#bp{display:flex;flex-direction:column;gap:6px}
#qs button,#gp button,#ol button,#sl button,#sr button,#pr button,#bp button,#bgo{background:#1f3324;border:1px solid #3f6a47;color:#efe8d0;border-radius:10px;padding:10px;text-align:left;font-size:13px;line-height:1.4}
#qs button b,#gp button b,#ol button b,#sl button b,#sr button b,#pr button b,#bp button b{display:block;font-size:14px;color:#fff}
#qs button span,#gp button span,#ol button span,#sl button span,#sr button span,#pr button span,#bp button span{color:#f5c542}
#qs button.off,#gp button.off,#ol button.off,#sl button.off,#sr button.off,#pr button.off,#bp button.off,#bgo.off{opacity:.45}
#qs button.rdy{border-color:#f5c542}
#ach{font-size:12px;color:#9bb08a;line-height:1.6;padding-bottom:20px}
#snd{display:flex;gap:8px;flex-wrap:wrap}
.scw{position:absolute;right:6px;bottom:4px;width:44px;pointer-events:none;opacity:.95}
.scw svg{width:100%;display:block}
#bs,#bm,#rbb{background:none;border:1px solid #3f6a47;color:#9bb08a;border-radius:8px;padding:8px 12px;font-size:12px;align-self:flex-start}
#sb{display:flex;gap:6px}
#sb button{flex:1;padding:9px 4px;font-size:12px;border-radius:8px;border:1px solid #3f6a47;background:#1f3324;color:#efe8d0}
#sb button.off{opacity:.45}
.crow{position:absolute;right:4px;top:4px;width:42%;display:none;pointer-events:none;animation:hop .4s infinite alternate}
.crow svg{width:100%;display:block}
@keyframes hop{to{transform:translateY(-4px)}}
#app{padding-bottom:84px}
#kt{display:flex;gap:6px;overflow-x:auto}
#kt button{flex:0 0 auto;padding:8px 12px;border-radius:8px;border:1px solid #3f6a47;background:#1f3324;color:#efe8d0;font-size:12px}
#kt button.sel{border-color:#f5c542}
#kt button.off{opacity:.45}
#kt button.alert{animation:blink .5s infinite alternate;border-color:#ff5252}
@keyframes blink{to{background:#6b1f1f}}
#field{touch-action:pan-y}
#uh{font-size:13px;color:#f5c542}
#qb{position:fixed;right:14px;bottom:14px;width:54px;height:54px;border-radius:50%;border:2px solid #f5c542;background:#1f3324;padding:0;z-index:5}
#qb svg{width:30px;height:30px;margin-top:2px}
#qbadge{position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:#ff5252;display:none}
#modal,#gmodal,#omodal,#tmodal,#pmodal,#bmodal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#mc,#gmc,#omc,#tmc,#pmc,#bmc{background:#16231a;border:1px solid #3f6a47;border-radius:12px;padding:14px;width:100%;max-width:380px;max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
#mx,#gx,#ox,#tx,#px,#bx{background:none;border:1px solid #3f6a47;color:#9bb08a;border-radius:8px;padding:8px;font-size:13px}
#gb{position:fixed;right:80px;bottom:14px;width:54px;height:54px;border-radius:50%;border:2px solid #f5c542;background:#1f3324;padding:0;z-index:5}
#gb svg{width:30px;height:30px;margin-top:2px}
#gbadge{position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:#ff5252;display:none}
#ob{position:fixed;right:146px;bottom:14px;width:54px;height:54px;border-radius:50%;border:2px solid #f5c542;background:#1f3324;padding:0;z-index:5}
#ob svg{width:30px;height:30px;margin-top:2px}
#obadge{position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:#ff5252;display:none}
#ol button.rdy{border-color:#f5c542}
#gl{font-size:13px;line-height:1.6}
.veg.mut{filter:hue-rotate(150deg) saturate(1.5) drop-shadow(0 0 5px #c070ff)}
.veg.wilt{filter:saturate(.45) brightness(.8)}
#fab{position:fixed;right:10px;bottom:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 20px);z-index:5}
#fab button{position:relative;right:auto;bottom:auto}
#pb{width:54px;height:54px;border-radius:50%;border:2px solid #f5c542;background:#1f3324;padding:0}
#pb svg{width:30px;height:30px;margin-top:2px}
#field.gh{box-shadow:inset 0 0 0 3px rgba(190,235,255,.6),inset 0 0 26px rgba(190,235,255,.22)}
#tk{position:fixed;right:212px;bottom:14px;width:54px;height:54px;border-radius:50%;border:2px solid #f5c542;background:#1f3324;padding:0;z-index:5}
#tk svg{width:30px;height:30px;margin-top:2px}
#tbadge{position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:#ff5252;display:none}
#field{position:relative}
#fw{position:relative}
#rc{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;border-radius:12px}
#title{position:fixed;inset:0;z-index:20;background:linear-gradient(#1c3a24,#0f1a12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#title h1{margin:0;font-size:40px;color:#f5c542;letter-spacing:1px}
#title p{margin:0;color:#9bb08a;font-size:14px}
#title button{margin-top:14px;padding:14px 52px;font-size:18px;border-radius:12px;border:2px solid #f5c542;background:#1f3324;color:#f5c542}
#title small{position:absolute;bottom:14px;color:#5d7a63;font-size:11px}
#toast{z-index:30;max-width:90vw;text-align:center;position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#1f3324;border:1px solid #f5c542;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <div id="top"><div id="money">$0</div><div id="info"></div></div>
  <div id="snd"><button id="bs"></button><button id="bm"></button><button id="rbb">Kebangkitan</button></div>
  <div id="crops"></div>
  <div id="sb"></div>
  <div id="kt"></div>
  <div id="fw"><div id="field"></div><canvas id="rc"></canvas></div>
  <div id="uh"></div>
  <div id="ups"></div>
  <div id="uh2" style="font-size:13px;color:#f5c542">Upgrade umum (semua kebun)</div>
  <div id="ug"></div>
</div>
<button id="qb"><svg viewBox="0 0 24 24" fill="none" stroke="#f5c542" stroke-width="2" stroke-linecap="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h4"/></svg><i id="qbadge"></i></button>
<div id="modal"><div id="mc"><div id="qh">Misi harian</div><div id="qs"></div><div id="ach"></div><button id="mx">Tutup</button></div></div>
<button id="gb"><svg viewBox="0 0 24 24" fill="none" stroke="#f5c542" stroke-width="2" stroke-linejoin="round"><path d="M3 10l9-6 9 6v10H3z"/><path d="M8 20v-6h8v6M8 17h8"/></svg><i id="gbadge"></i></button>
<div id="gmodal"><div id="gmc"><div id="gh" style="font-size:15px;color:#f5c542"></div><div id="gl"></div><div id="gp"></div><button id="gx">Tutup</button></div></div>
<button id="ob"><svg viewBox="0 0 24 24" fill="none" stroke="#f5c542" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h3l2.5 10h9L20 8H7"/><circle cx="9.5" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/></svg><i id="obadge"></i></button>
<div id="omodal"><div id="omc"><div style="font-size:15px;color:#f5c542">Pesanan pelanggan</div><div id="ol"></div><div id="oe" style="font-size:12px;color:#9bb08a"></div><button id="ox">Tutup</button></div></div>
<button id="tk"><svg viewBox="0 0 24 24" fill="none" stroke="#f5c542" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l2-5h14l2 5"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/></svg><i id="tbadge"></i></button>
<div id="tmodal"><div id="tmc"><div style="font-size:15px;color:#f5c542">Toko perlengkapan</div><div id="sl"></div><div style="font-size:14px;color:#f5c542;margin-top:6px">Bibit langka</div><div id="sr"></div><div id="tt" style="font-size:12px;color:#9bb08a"></div><button id="tx">Tutup</button></div></div>
<button id="pb"><svg viewBox="0 0 24 24" fill="none" stroke="#f5c542" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20V10l5 3v-3l5 3V5h5v15z"/><path d="M7 20v-4h3v4"/></svg></button>
<div id="pmodal"><div id="pmc"><div style="font-size:15px;color:#f5c542">Pabrik pengolahan</div><div id="pi" style="font-size:12px;color:#9bb08a"></div><div id="pj" style="font-size:13px;line-height:1.6"></div><div id="pr"></div><button id="px">Tutup</button></div></div>
<div id="bmodal"><div id="bmc"><div style="font-size:15px;color:#f5c542">Kebangkitan</div><div id="bi" style="font-size:13px;line-height:1.6"></div><div id="bp"></div><button id="bgo"></button><div style="font-size:11px;color:#9bb08a">Bangkit mengulang dari awal: uang, kebun, upgrade, dan gudang di-reset. Yang tetap: pencapaian, Biji Unggul, dan perk.</div><button id="bx">Tutup</button></div></div>
<div id="title"><svg viewBox="0 0 100 100" width="130"><circle cx="74" cy="24" r="13" fill="#f5c542"/><path d="M50 90V52" stroke="#5fa84a" stroke-width="6" stroke-linecap="round"/><path d="M50 62C34 62 24 52 22 38C38 38 48 46 50 62Z" fill="#4caf50"/><path d="M50 54C64 54 74 44 76 32C62 32 52 40 50 54Z" fill="#66bb6a"/><ellipse cx="50" cy="92" rx="28" ry="6" fill="#5a3a22"/></svg><h1>Tani Musim</h1><p>Tanam, panen, jual, ikuti musim</p><button id="tm">Mulai</button></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const CR=[
  {n:'Wortel',t:4,v:3,s:1,c:'#f08a24',u:0},
  {n:'Tomat',t:8,v:2.3,s:3,c:'#e0443a',u:60},
  {n:'Jagung',t:15,v:13,s:7,c:'#f2d03b',u:400},
  {n:'Semangka',t:30,v:60,s:20,c:'#3fb86b',u:3000},
  {n:'Terong',t:12,v:11,s:6,c:'#5b2d91',u:0,ss:0},
  {n:'Padi',t:20,v:45,s:14,c:'#e0b83a',u:0,ss:1},
  {n:'Cabai',t:10,v:4,s:5,c:'#e53935',u:0,ss:2},
  {n:'Melon Emas',t:50,v:220,s:90,c:'#f5c542',u:0,rare:1},
  {n:'Labu Raksasa',t:80,v:420,s:160,c:'#ef8a1a',u:0,rare:1}
];
const AVGY=[1,3.5,1.5,1,1.5,1,3.5,1,1];
const UN=['','buah','tongkol','','buah','','buah','',''];
const MAXP=9,MAXK=10;
let S={m:10,kb:[{pl:[],au:0,fz:0,pr:0}],sel:0,un:1,bb:[0,0,0,0],st:0,wu:[0,0,0,0],wv:[0,0,0,0],wc:0,sl:0,tb:[0,0,0,0],sfx:1,mus:1,ru:[],rs:[],sm:0,mc:0,ml:0,pw:0,jobs:[],olv:0,olu:0,rb:0,bu:0,earn:0,rp:{h:0,g:0,q:0,m:0},wq:[],wvq:[],od:[],odn:0,pm:0,cr:0,gd:0,hv:0,ac:[],dq:{d:'',hv:0,up:0,tp:0,cl:[0,0,0]},t:Date.now()};
const DEF0=JSON.stringify(S);
try{const s=JSON.parse(localStorage.getItem('kebun1'));if(s){if(!s.kb)s.kb=[{pl:s.pl||[],au:s.au||0,fz:s.fz||0,pr:s.pr||0}];S=Object.assign(S,s);delete S.pl;delete S.au;delete S.fz;delete S.pr}}catch(e){}
S.kb.forEach(k=>{if(k.pl.length>MAXP)k.pl.length=MAXP;while(k.pl.length<3)k.pl.push({c:-1,p:0})});
if(!Array.isArray(S.bb))S.bb=[0,0,0,0];
['bb','tb','wu','wv','rs','ru'].forEach(a=>{if(!Array.isArray(S[a]))S[a]=[];while(S[a].length<CR.length)S[a].push(0)});
if(S.rf===undefined){S.rf=1;S.rs[7]=2;S.rs[8]=1}
S.wq=S.wq||[];S.wvq=S.wvq||[];
for(let c=0;c<CR.length;c++){
  if(!Array.isArray(S.wq[c])||S.wq[c].length!=3||S.wq[c].reduce((a,b)=>a+b,0)!==S.wu[c]){S.wq[c]=[S.wu[c],0,0];S.wvq[c]=[S.wv[c],0,0]}
  if(!Array.isArray(S.wvq[c]))S.wvq[c]=[S.wv[c],0,0];
}
let vk=0;const K=()=>S.kb[vk];

const SE=[
  {n:'Cerah',f:1,g:.15,pr:1,lw:1,rg:[600,1200],rd:[60,120],bg:'#2c4a30',d:'panen emas 15%, hujan jarang'},
  {n:'Hujan',f:1.2,g:.08,pr:1,lw:2,rg:[180,420],rd:[120,240],bg:'#25415a',d:'tumbuh +20%, layu lambat, sering hujan'},
  {n:'Kemarau',f:.7,g:.08,pr:1.3,lw:.6,rg:[1200,2400],rd:[45,90],bg:'#5a4a25',d:'lambat, jual x1.3, layu cepat, hujan langka'}
];
let se=S.se||0,seT=S.sT||(1800+Math.random()*1800),rain=0,rainT=0;
rainT=SE[se].rg[0]+Math.random()*(SE[se].rg[1]-SE[se].rg[0]);
const M=[{n:'Pasar Desa',mu:1,pr:1,mean:1,vol:.06},{n:'Pasar Kota',mu:1,pr:1,mean:1,vol:.25},{n:'Pasar Induk',mu:1.1,pr:1.1,mean:1.1,vol:.14}];let mT=8;
const gt=(c,k)=>CR[c].t/(1+.15*k.fz)/(k.gh?Math.max(1,SE[se].f):SE[se].f)/(rain>0?1.5:1)/(1+.08*S.rp.g);
const price=(c,k)=>CR[c].v*(1+.25*k.pr)*(1+.02*S.ac.length)*(1+.1*S.rp.h)*SE[se].pr;
const pv=(c,k)=>price(c,k)*AVGY[c];
const cap=()=>5+5*S.st;
const whTot=()=>S.wu.reduce((a,b)=>a+b,0);
const WC=()=>30+10*S.wc;
const tot=()=>S.bb.reduce((a,b)=>a+b,0);
const ttot=()=>S.tb.reduce((a,b)=>a+b,0);
const SC=()=>20+10*S.sl;
const seeds=c=>S.bb[c]+S.tb[c];
const canPlant=(c,k)=>CR[c].ss===undefined||CR[c].ss===se||!!(k&&k.gh);
function takeSeed(c){if(S.bb[c]>=1){S.bb[c]--;return 1}if(S.tb[c]>=1){S.tb[c]--;return 1}return 0}
const COST={
  au:k=>Math.ceil(40*Math.pow(1.6,k.au)),
  fz:k=>Math.ceil(25*Math.pow(1.5,k.fz)),
  pr:k=>Math.ceil(30*Math.pow(1.55,k.pr)),
  pt:k=>Math.ceil(50*Math.pow(1.8,k.pl.length-3)),
  st:()=>Math.ceil(40*Math.pow(1.7,S.st)),
  wc:()=>Math.ceil(60*Math.pow(1.7,S.wc)),
  sl:()=>Math.ceil(50*Math.pow(1.6,S.sl)),
  sc:k=>Math.ceil(80*Math.pow(1.8,k.sc||0)),
  gh:k=>Math.ceil(1500*Math.pow(2.5,S.kb.filter(x=>x.gh).length)),
  ml:()=>Math.ceil(800*Math.pow(2.2,S.ml)),
  pw:()=>Math.ceil(600*Math.pow(2.5,S.pw))
};
const KC=()=>Math.ceil(500*Math.pow(3,S.kb.length-1));
const NAME={au:'Tukang kebun',fz:'Pupuk (tumbuh cepat)',pr:'Harga jual',pt:'Tambah petak',st:'Tangan (bibit +5)',sl:'Tempat bibit +10',sc:'Orang-orangan sawah',wc:'Gudang +10',gh:'Rumah kaca',ml:'Mesin pengolah (slot)',pw:'Pekerja pengolah'};

const MQ=[{n:'Panen 25 tanaman',k:'hv',g:25},{n:'Beli 3 upgrade',k:'up',g:3},{n:'Panen manual 5x',k:'tp',g:5}];
const AC=[
  {id:'a',n:'Panen pertama',f:()=>S.hv>=1},
  {id:'b',n:'100 panen',f:()=>S.hv>=100},
  {id:'c',n:'1000 panen',f:()=>S.hv>=1000},
  {id:'d',n:'6 petak',f:()=>S.kb.some(k=>k.pl.length>=6)},
  {id:'e',n:'9 petak',f:()=>S.kb.some(k=>k.pl.length>=9)},
  {id:'f',n:'Semua tanaman terbuka',f:()=>S.un>=4},
  {id:'g',n:'Tukang kebun Lv 5',f:()=>S.kb.some(k=>k.au>=5)},
  {id:'h',n:'Usir 10 gagak',f:()=>S.cr>=10},
  {id:'i',n:'Panen emas pertama',f:()=>S.gd>=1},
  {id:'j',n:'Punya 2 kebun',f:()=>S.kb.length>=2},
  {id:'k',n:'Punya 4 kebun',f:()=>S.kb.length>=4},
  {id:'l',n:'Punya 10 kebun',f:()=>S.kb.length>=10},
  {id:'m',n:'Selesaikan 1 pesanan',f:()=>S.odn>=1},
  {id:'n',n:'Selesaikan 10 pesanan',f:()=>S.odn>=10},
  {id:'o',n:'Panen Prima pertama',f:()=>S.pm>=1},
  {id:'p',n:'Panen mutan pertama',f:()=>S.mc>=1},
  {id:'q',n:'Beli bibit langka',f:()=>S.ru.some(x=>x)},
  {id:'r',n:'Punya rumah kaca',f:()=>S.kb.some(k=>k.gh)},
  {id:'s',n:'Punya mesin pengolah',f:()=>S.ml>=1},
  {id:'t',n:'Olah hasil panen pertama',f:()=>S.olu>=1},
  {id:'u',n:'Bangkit pertama kali',f:()=>S.rb>=1}
];
const rew=()=>Math.ceil(Math.max(50,pv(S.sel,S.kb[0])*S.kb.reduce((a,k)=>a+k.pl.length,0)*15));
function chkDay(){const d=new Date().toLocaleDateString('sv-SE');if(S.dq.d!==d)S.dq={d:d,hv:0,up:0,tp:0,cl:[0,0,0]}}
function chkAc(){AC.forEach(a=>{if(!S.ac.includes(a.id)&&a.f()){S.ac.push(a.id);toast('Pencapaian: '+a.n)}})}
function count(man){S.hv++;S.dq.hv++;if(man)S.dq.tp++}
function claim(i){const q=MQ[i];if(S.dq.cl[i]||S.dq[q.k]<q.g)return;S.dq.cl[i]=1;const r=rew();S.m+=r;S.earn=(S.earn||0)+r;sfx('koin');toast('Hadiah $'+fmt(r))}
function qui(){
  MQ.forEach((q,i)=>{
    const b=$('q_'+i),v=Math.min(S.dq[q.k],q.g),done=S.dq[q.k]>=q.g,cl=S.dq.cl[i];
    b.innerHTML='<b>'+q.n+'</b>'+v+'/'+q.g+(cl?' &middot; selesai':' &middot; <span>hadiah $'+fmt(rew())+'</span>');

  });

let acc=[];
function update(dt){
  const all=[],cl=[];S.kb.forEach((k,kk)=>k.pl.forEach((p,i)=>{if(p.c>=0){all.push([kk,i]);if(!k.gh)cl.push([kk,i])}}));
  if(tot()+ttot()==0&&!all.length&&whTot()==0&&S.m<CR[0].s){S.bb[0]=1;toast('Bantuan 1 bibit wortel')}
  crowT-=dt;if(rain>0&&crowT<10)crowT=10;
  if(crow){
    const cp=S.kb[crow.k].pl[crow.i];
    if(cp.c<0)crow=null;
    else{crow.t-=dt;if(crow.t<=0){cp.c=-1;cp.p=0;cp.a=0;toast('Gagak memakan tanamanmu di Kebun '+(crow.k+1));crow=null}}
  }else if(crowT<=0){
    if(cl.length){const a=cl[Math.floor(Math.random()*cl.length)];if(Math.random()<Math.min(.9,(S.kb[a[0]].sc||0)*.25)){toast('Orang-orangan sawah mengusir gagak di Kebun '+(a[0]+1));sfx('usir')}else{crow={k:a[0],i:a[1],t:6};sfx('gagak');toast(a[0]==vk?'Gagak mendarat! Ketuk petaknya':'Gagak mendarat di Kebun '+(a[0]+1)+'!')}}
    crowT=30+Math.random()*30;
  }
  mT-=dt;if(mT<=0){mT=8;M.forEach(m=>{m.pr=m.mu;m.mu=Math.max(.6,Math.min(1.8,m.mu+(m.mean-m.mu)*.25+(Math.random()-.5)*2*m.vol))})}
  shopT-=dt;if(shopT<=0)refreshShop();
  S.jobs.forEach(j=>j.t-=dt);
  const dn=S.jobs.filter(j=>j.t<=0);
  if(dn.length){S.jobs=S.jobs.filter(j=>j.t>0);dn.forEach(j=>{S.olv+=j.v;S.olu+=j.n});toast(OLN[dn[0].c]+' selesai diolah!');sfx('koin')}
  if(S.pw>0&&S.ml>0&&S.jobs.length<S.ml){let best=-1;for(let c=0;c<CR.length;c++)if(S.wu[c]>=BATCH&&(best<0||S.wu[c]>S.wu[best]))best=c;if(best>=0)startJob(best,1)}
  S.od.forEach(o=>o.t-=dt);
  const ex=S.od.filter(o=>o.t<=0);if(ex.length){S.od=S.od.filter(o=>o.t>0);toast('Pesanan dari '+ex[0].n+' kedaluwarsa')}
  orderT-=dt;if(orderT<=0){orderT=90+Math.random()*90;if(S.od.length<3)newOrder()}
  seT-=dt;
  if(seT<=0){se=(se+1+Math.floor(Math.random()*(SE.length-1)))%SE.length;seT=1800+Math.random()*1800;rain=0;rainT=SE[se].rg[0]+Math.random()*(SE[se].rg[1]-SE[se].rg[0]);F.style.background=SE[se].bg;toast('Musim '+SE[se].n+': '+SE[se].d+'. Bisa ditanam: '+CR.filter(c=>c.ss===se).map(c=>c.n).join(', '))}
  if(rain>0){rain-=dt;if(rain<=0){rain=0;toast('Hujan reda')}}
  else{rainT-=dt;if(rainT<=0){const r=SE[se];rain=r.rd[0]+Math.random()*(r.rd[1]-r.rd[0]);rainT=r.rg[0]+Math.random()*(r.rg[1]-r.rg[0]);toast('Hujan turun!')}}
  S.kb.forEach((k,kk)=>{
    for(const p of k.pl)if(p.c>=0){
      if(p.p<1)p.p=Math.min(1,p.p+dt/gt(p.c,k));
      else{p.a=(p.a||0)+dt/(SE[se].lw*(rain>0?2:1)*(k.gh?2:1)*(1+.25*Math.min(k.au||0,3)));if(p.a>=150){p.c=-1;p.p=0;p.a=0;p.n=0;toast('Tanaman layu di Kebun '+(kk+1))}}
    }
    if(k.au>0){
      acc[kk]=Math.min((acc[kk]||0)+dt*k.au*.5,2);
      while(acc[kk]>=1){
        acc[kk]--;
        let i=k.pl.findIndex(p=>p.c>=0&&p.p>=1);
        if(i>=0){const p=k.pl[i];if(harvest(kk,i,0)){if(canPlant(p.c,k)&&takeSeed(p.c)){p.p=0;setMt(p)}else p.c=-1}}
        else{i=k.pl.findIndex(p=>p.c<0);const pc=canPlant(S.sel,k)?S.sel:0;if(i>=0&&takeSeed(pc)){k.pl[i].c=pc;k.pl[i].p=0;setMt(k.pl[i])}}
      }
    }
  });
}

function rainFx(dt){

  rx.clearRect(0,0,w,h);
  if(rain<=0&&!drops.length)return;
  if(rain>0){
    rx.fillStyle='rgba(40,70,110,.12)';rx.fillRect(0,0,w,h);
    for(let i=0;i<3&&drops.length<90;i++)drops.push({x:Math.random()*w,y:-Math.random()*40,l:12+Math.random()*14,v:420+Math.random()*260});

  drops=drops.filter(p=>{p.y+=p.v*dt;p.x+=p.v*dt*.06;rx.moveTo(p.x-p.l*.06,p.y-p.l);rx.lineTo(p.x,p.y);return p.y-p.l<h});
  rx.stroke();
}

$('mx').onclick=()=>$('modal').style.display='none';
$('modal').onclick=e=>{if(e.target.id=='modal')$('modal').style.display='none'};
function nBuy(full){if(CR[S.sel].rare)return 0;const room=(cap()-tot())+(SC()-ttot());const n=Math.min(full?1e9:1,room,Math.floor(S.m/CR[S.sel].s));return n<0?0:n}
function buySeed(full){
  const n=nBuy(full);
  if(n<1){toast(CR[S.sel].rare?'Bibit langka hanya dijual di toko':(cap()-tot())+(SC()-ttot())<1?'Tangan dan tempat bibit penuh':'Uang kurang');return}
  S.m-=n*CR[S.sel].s;sfx('koin');
  const h=Math.min(n,cap()-tot());S.bb[S.sel]+=h;S.tb[S.sel]+=n-h;ui();
}
['sb1','sbf'].forEach((id,i)=>{const b=document.createElement('button');b.id=id;b.onclick=()=>buySeed(i);$('sb').appendChild(b)});
MQ.forEach((q,i)=>{
  const b=document.createElement('button');b.id='q_'+i;
  b.onclick=()=>claim(i);$('qs').appendChild(b);
});
function ui(){
  chkDay();chkAc();qui();
  $('money').textContent='$'+fmt(S.m);
  const sc=CR[S.sel].s,n1=nBuy(0),nf=nBuy(1);
  $('sb1').innerHTML='Beli 1 bibit '+CR[S.sel].n+' ($'+fmt(sc)+')';$('sb1').className=n1<1?'off':'';
  $('sbf').innerHTML='Isi penuh ('+nf+') $'+fmt(nf*sc);$('sbf').className=nf<1?'off':'';
  $('info').innerHTML='Tangan: '+tot()+'/'+cap()+'<br>Tempat bibit: '+ttot()+'/'+SC()+((performance.now()-lastH<2500&&cmb>1)?'<br>Combo x'+comboX().toFixed(1):'')+'<br>Gudang: '+whTot()+'/'+WC()+'<br>Petak: '+K().pl.length+'/'+MAXP+'<br>Tukang kebun: Lv '+K().au+'<br>Musim: '+SE[se].n+' ('+Math.ceil(seT/60)+' mnt)'+(rain>0?'<br>Sedang hujan':'')+'<br>'+SE[se].d;
  CR.forEach((cr,i)=>{
    const b=$('c_'+i);
    b.style.display=(cr.rare&&!S.ru[i])?'none':'';
    if(i<S.un||cr.ss!==undefined||cr.rare){b.innerHTML=cr.n+'<br>jual $'+fmt(price(i,K()))+(UN[i]?'/'+UN[i]:'')+'<br>bibit '+seeds(i)+(cr.ss!==undefined?'<br>musim '+SE[cr.ss].n:'')+(cr.rare?'<br>langka':'');b.className=(i==S.sel?'sel ':'')+(canPlant(i,K())?'':'oos')}
    else if(i==S.un){b.innerHTML=cr.n+'<br>Buka $'+fmt(cr.u);b.className='lock'}
    else{b.innerHTML='?<br>-';b.className='lock'}
  });
  const kb=K(),lv={au:kb.au,fz:kb.fz,pr:kb.pr,pt:kb.pl.length-3,st:S.st,sl:S.sl,wc:S.wc,sc:kb.sc||0,gh:kb.gh?1:0,ml:S.ml,pw:S.pw};
  $('uh').textContent='Upgrade Kebun '+(vk+1)+(kb.gh?' (Rumah kaca)':'');
  F.classList.toggle('gh',!!kb.gh);
  for(const k in NAME){
    const b=$('b_'+k),max=(k=='pt'&&kb.pl.length>=MAXP)||(MAXLV[k]!==undefined&&lvl(k,kb)>=MAXLV[k]),c=COST[k](kb);
    b.innerHTML='<b>'+NAME[k]+'</b>'+(DESC[k]?DESC[k]+'<br>':'')+'Lv '+lv[k]+(max?' (maks)':' &middot; <span>$'+fmt(c)+'</span>');
    b.className=(max||S.m<c)?'off':'';
  }
  S.kb.forEach((k,i)=>{const b=$('k_'+i);if(b)b.className=(i==vk?'sel ':'')+((crow&&crow.k==i&&i!=vk)?'alert':'')});
  const nk=$('k_new');if(nk){nk.textContent='+ Kebun $'+fmt(KC());nk.className=S.m<KC()?'off':''}
  $('bs').textContent='Efek: '+(S.sfx?'on':'off');$('bm').textContent='Musik: '+(S.mus?'on':'off');
  gains();rainSnd(rain>0);
  F.classList.toggle('rain',rain>0);
  $('gbadge').style.display=whTot()>=WC()?'block':'none';
  if($('pmodal').style.display=='flex')pui();
  $('rbb').textContent=(S.earn||0)>=RMIN?'Kebangkitan (siap!)':'Kebangkitan';
  if($('bmodal').style.display=='flex')bui();
  $('tbadge').style.display=shopNew?'block':'none';
  if($('tmodal').style.display=='flex')tui();
  $('obadge').style.display=S.od.some(o=>avail(o.c,o.mq)>=o.q)?'block':'none';
  if($('omodal').style.display=='flex')oui();
  if($('gmodal').style.display=='flex')gui();
  $('qbadge').style.display=MQ.some((q,i)=>!S.dq.cl[i]&&S.dq[q.k]>=q.g)?'block':'none';
}

let noSave=0,rsT;
let started=0;
$('tm').onclick=()=>{started=1;actx();$('title').style.display='none'};
$('bs').onclick=()=>{S.sfx=S.sfx?0:1;ui()};
$('bm').onclick=()=>{S.mus=S.mus?0:1;ui()};
function save(){if(noSave)return;S.t=Date.now();S.se=se;S.sT=seT;try{localStorage.setItem('kebun1',JSON.stringify(S))}catch(e){}}
setInterval(save,3000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});

let last=performance.now(),uiT=0;
function loop(now){
  const dt=Math.min((now-last)/1000,0.1);last=now;
  if(started)update(dt);render();rainFx(dt);
  uiT+=dt;if(uiT>0.2){uiT=0;ui()}
  requestAnimationFrame(loop);
}
F.style.background=SE[se].bg;build();ui();requestAnimationFrame(loop);
</script>
</body>
</html>
